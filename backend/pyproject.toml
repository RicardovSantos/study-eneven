[project]
name = "devlog-backend"
version = "0.1.0"
description = "DevLog — API da plataforma familiar de estudos"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.17",
  "pillow>=11.0",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
